name: dashboard-build

on:
  push:
    paths:
      - "olap-frontend/**"
      - ".github/workflows/dashboard-build.yml"
  pull_request:
    paths:
      - "olap-frontend/**"
      - ".github/workflows/dashboard-build.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: olap-frontend/package-lock.json

      - name: Install
        working-directory: olap-frontend
        run: npm ci

      - name: Build
        working-directory: olap-frontend
        run: npm run build
