name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: ETL tests
        run: uv run --project etl pytest etl/tests

      - name: Source importer tests
        run: uv run --project db pytest db/source/importer
