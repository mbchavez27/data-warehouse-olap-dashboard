name: dashboard-tests

on:
  push:
    paths:
      - "olap-frontend/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "olap-frontend/**"
      - ".github/workflows/dashboard-tests.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: olap-frontend/package-lock.json

      - name: Install
        working-directory: olap-frontend
        run: npm ci

      # Both dashboard suites: the sample data and the reports against the
      # generated column contract, and the four reports rendered server-side
      # in every view state. Neither needs a database or a browser.
      # `npm run check:contracts` covers the SQL itself, which needs the
      # warehouse, and the source archive is not in the repository.
      - name: Contracts and rendered reports
        working-directory: olap-frontend
        run: npm test
